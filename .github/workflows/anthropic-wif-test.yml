name: anthropic-wif-test

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      - name: Exchange for an Anthropic access token
        run: |
          RESPONSE=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01WmThjhm7zrb3K5xx935xCG",
            "organization_id": "fb79e2ba-3517-4543-8ca3-b1b7461a9f5c",
            "service_account_id": "svac_01YYdrg7gB99p2y8vUj2QpDL",
            "workspace_id": "wrkspc_01TrRqpu3RnhFuUYW145SWMR"
          }
          JSON
          )

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "WIF token exchange failed"
            echo "$RESPONSE" | jq 'del(.access_token)'
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "ANTHROPIC_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Call Claude
        run: |
          curl -sS https://api.anthropic.com/v1/messages \
            -H "content-type: application/json" \
            -H "anthropic-version: 2023-06-01" \
            -H "authorization: Bearer $ANTHROPIC_ACCESS_TOKEN" \
            --data @- <<'JSON' | jq .
          {
            "model": "claude-sonnet-4-6",
            "max_tokens": 128,
            "messages": [
              {
                "role": "user",
                "content": "Réponds exactement : WIF_CLAUDE_OK"
              }
            ]
          }
          JSON